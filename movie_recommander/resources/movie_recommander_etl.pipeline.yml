# The main pipeline for movie_recommander

resources:
  pipelines:
    movie_recommander_etl:
      name: movie_recommander_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/movie_recommander_etl"

      libraries:
        - glob:
            include: ../src/movie_recommander_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
